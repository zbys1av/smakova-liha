function validState(s){return !!s&&s.version===1&&Array.isArray(s.dishes)&&Array.isArray(s.history)&&s.tournaments&&s.freePairs&&Array.isArray(s.champions)&&s.dishes.every(d=>typeof d.id==='string'&&typeof d.name==='string'&&typeof d.category==='string')}

function hashStr(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
// GitHub Cloud: offline-first, explicit saves, protected by Worker + verified Google ID token.
// JSON contains all dishes, completed matches, calibration state and tournaments.
const CLOUD_CONFIG=window.SMAKOVA_CLOUD||{apiUrl:'',googleClientId:'',publicDataUrl:'./data.json'};
const cloud={remote:null,sha:null,loading:false,saving:false,notice:'',loginToken:null,loginEmail:'',googleLoading:null,meta:(()=>{try{return JSON.parse(localStorage.getItem(CLOUD_META_KEY)||'null')}catch{return null}})()};
function cloudSnapshot(s=state){return {...s,undo:null}}
function cloudSignature(s=state){const copy=cloudSnapshot(s);return String(hashStr(JSON.stringify(copy)))+'-'+JSON.stringify(copy).length}
function cloudHasUnsaved(){return !cloud.meta||cloud.meta.signature!==cloudSignature()}
function cloudNotice(value){cloud.notice=value; if(ui.page==='settings')render()}
function cloudRemember(sha){cloud.meta={sha:sha||null,signature:cloudSignature(),savedAt:new Date().toISOString()};try{localStorage.setItem(CLOUD_META_KEY,JSON.stringify(cloud.meta))}catch{}}
function cloudNormalize(payload){const s=deep(payload);s.undo=null;s.calibrations=s.calibrations||{};s.freePairs=s.freePairs||{};s.dishes=s.dishes.map(d=>normalizeDish(d));return s}
function cloudApply(payload,sha){const ready=cloudNormalize(payload);if(!validState(ready))throw Error('Некоректний JSON у GitHub');state=ready;ui.modal=null;ui.search='';ui.calibrationTarget=null;ui.category='Десерт';ui.rankCategory='all';state.undo=null;cloud.sha=sha||null;save();cloudRemember(cloud.sha);render()}
async function cloudFetch(){
 const url=String(CLOUD_CONFIG.apiUrl||'').trim().replace(/\/$/,'');
 if(url){const r=await fetch(url+'/data',{cache:'no-store'});const json=await r.json().catch(()=>({}));if(!r.ok)throw Error(json.error||'GitHub: помилка '+r.status);if(!validState(json.data)||!json.sha)throw Error('Некоректна відповідь GitHub Worker');return {data:json.data,sha:json.sha}}
 // Read-only bootstrap from public GitHub Pages; writing always needs a configured Worker.
 const r=await fetch(CLOUD_CONFIG.publicDataUrl||'./data.json',{cache:'no-store'});if(!r.ok)throw Error('data.json: HTTP '+r.status);const data=await r.json();if(!validState(data))throw Error('Некоректний data.json');return {data,sha:null};
}
async function cloudRefresh({automatic=false}={}){
 if(cloud.loading||cloud.saving)return;cloud.loading=true;cloud.notice='Перевіряємо GitHub…';if(ui.page==='settings')render();
 try{
  const latest=await cloudFetch();cloud.remote=latest.data;cloud.sha=latest.sha;
  const same=cloudSignature(cloudNormalize(latest.data))===cloudSignature();
  if(same){cloudRemember(latest.sha);cloud.notice='Локальні дані збігаються з GitHub.';}
  else if(automatic&&(!HAD_LOCAL_DATA||(cloud.meta&&!cloudHasUnsaved()&&cloud.meta.sha!==null&&latest.sha!==cloud.meta.sha))){cloudApply(latest.data,latest.sha);cloud.notice='Дані оновлено з GitHub.';}
  else if(automatic&&cloud.meta&&!cloudHasUnsaved()&&cloud.meta.sha===latest.sha){cloud.notice='Локальна версія збережена в GitHub.';}
  else {cloud.notice='Є відмінності між локальною та GitHub-версією. Оберіть потрібну копію вручну.';}
 }catch(err){cloud.notice='Хмара недоступна: '+err.message+' Локальні дані працюють далі.';}
 finally{cloud.loading=false;if(ui.page==='settings')render()}
}
async function cloudLoad(){
 if(!cloud.remote){cloudNotice('Спершу перевірте GitHub.');return}
 if(!confirm('Замінити ВСІ локальні страви, рейтинги, турніри та історію версією з GitHub? Незбережені локальні зміни будуть втрачені. Раджу спершу експортувати JSON.'))return;
 cloudApply(cloud.remote,cloud.sha);cloud.notice='Завантажено версію з GitHub.';toast('Дані з GitHub завантажено.');
}
function cloudGitHubUrl(){return String(CLOUD_CONFIG.apiUrl||'').trim().replace(/\/$/,'')}
async function cloudAuthorized(){
 if(!cloud.loginToken)throw Error('Спершу увійдіть через Google');
 const r=await fetch(cloudGitHubUrl()+'/me',{headers:{Authorization:'Bearer '+cloud.loginToken},cache:'no-store'});
 const payload=await r.json().catch(()=>({}));if(!r.ok)throw Error(payload.error||'Google-доступ відхилено');cloud.loginEmail=payload.email||'';return true
}
function cloudUseLocal(){
 if(!cloud.remote||!cloud.sha){cloudNotice('Спершу перевірте GitHub через налаштований Worker.');return}
 if(!confirm('Зберегти саме ЛОКАЛЬНУ версію поверх поточних даних GitHub? Це замінить хмарні страви, історію, турніри та рейтинги. Рекомендуємо спочатку завантажити JSON-бекап.'))return;
 // Adopt the SHA as the expected base, but retain an intentionally dirty local state.
 // GitHub SHA is checked once again at save time, so concurrent changes cannot be overwritten.
 cloud.meta={sha:cloud.sha,signature:'pending-upload',savedAt:null};
 try{localStorage.setItem(CLOUD_META_KEY,JSON.stringify(cloud.meta))}catch{}
 cloudNotice('Обрано локальну версію. Увійдіть через Google та натисніть «Зберегти в GitHub».');
}
async function cloudSave(){
 if(cloud.saving||cloud.loading)return;if(!cloudGitHubUrl()){cloudNotice('Для запису спочатку потрібно розгорнути Cloudflare Worker і вказати його URL у cloud-config.js.');return}
 if(!cloud.loginToken){cloudNotice('Для збереження потрібен вхід через Google.');return}
 cloud.saving=true;cloud.notice='Перевіряємо доступ і зберігаємо…';render();
 try{
  await cloudAuthorized();
  // If no SHA is known or this session last fetched the repository some time ago, first refresh.
  // Always compare a live SHA to our last synchronized version to prevent silent overwrites.
  const live=await cloudFetch();cloud.remote=live.data;cloud.sha=live.sha;
  if(!live.sha)throw Error('Worker не повернув версію GitHub (SHA)');
  if(!cloud.meta){
   if(cloudSignature(cloudNormalize(live.data))!==cloudSignature())throw Error('У GitHub уже є інша версія. Перед першим записом перевірте дані та виберіть, яку копію зберегти.');
   cloudRemember(live.sha);
  }
  if(cloud.meta.sha!==live.sha)throw Error('Конфлікт: дані GitHub змінилися на іншому пристрої. Перевірте хмарну версію перед збереженням.');
  const snapshot=cloudSnapshot();
  const r=await fetch(cloudGitHubUrl()+'/data',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cloud.loginToken},body:JSON.stringify({data:snapshot,expectedSha:live.sha})});
  const result=await r.json().catch(()=>({}));if(!r.ok)throw Error((r.status===409?'Конфлікт GitHub: ':'' )+(result.error||'HTTP '+r.status));
  if(!result.saved||!result.sha)throw Error('GitHub не підтвердив коміт');
  cloud.sha=result.sha;cloud.remote=snapshot;
  // If votes were made while network request was pending, mark as unsaved.
  cloud.meta={sha:result.sha,signature:cloudSignature(snapshot),savedAt:new Date().toISOString()};
  try{localStorage.setItem(CLOUD_META_KEY,JSON.stringify(cloud.meta))}catch{}
  cloud.notice='Дані успішно збережено в GitHub. Коміт '+String(result.commit||'').slice(0,7);
  toast('Смакову лігу збережено в GitHub.');
 }catch(err){cloud.notice='Не вдалося зберегти: '+err.message;toast('GitHub: збереження не виконано.')}finally{cloud.saving=false;if(ui.page==='settings')render()}
}

function canonicalDishLabel(value){return String(value||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('uk')}
function dishNameTaken(name,category,excludeId=null){const key=canonicalDishLabel(name),cat=canonicalDishLabel(category);return activeDishes().some(d=>d.id!==excludeId&&canonicalDishLabel(d.name)===key&&canonicalDishLabel(d.category)===cat)}

function eloExpected(a,b){return 1/(1+Math.pow(10,(b-a)/400))}
function stats(){

  const a=map[h.winner],b=map[h.loser];if(!a||!b)continue;

    // Snapshot K in the match record to preserve results when rules evolve.
    const k=Number.isFinite(Number(h.k))&&Number(h.k)>0?Number(h.k):(h.scope==='same'?32:CAL_K);

   }else{

   }

   const ka=ga<12?32:ga<35?24:16,kb=gb<12?32:gb<35?24:16;

   a.wins++;b.losses++;a.games++;b.games++;a.xp+=Number(h.earned||0);a.last=h.date;b.last=h.date;
  }
 }

function chooseCalibrationOpponent(id,ignoreId=null){

d.length?'<div class="empty">Страви за цим запитом не знайдено.</div>':''}</div><p class="section-note">* Консервативний рейтинг = Elo − 65 / √(1 + звичайні двобої + 0,5 × міжкатегорійні калібрувальні двобої). Поправка за недостатню кількість порівнянь. Усі нові страви починають з однакового Elo 1500. У режимі «Усі категорії» рейтинг є орієнтовним: основні матчі проходять лише всередині категорій, тому міжкатегорійне порівняння менш точне.</p></section>`}
function catalog(){const sm=stats(),arr=activeDishes().filter(d=>(ui.category==='all'||d.category===ui.category)&&d.name.toLowerCase().includes(ui.search.toLowerCase())).map(normalizeDish);return `${pageHead('РЕЦЕПТИ ТА НОТАТКИ','Усі ваші страви.','У каталозі збережено назви, описи, тип смаку та історичні оцінки з оригінальної таблиці.',`<button class="button primary" data-action="addDish">+ Додати страву</button>`)}<div class="filterbar"><input class="search" id="searchInput" placeholder="Знайти страву..." value="${esc(ui.search)}" aria-label="Пошук страв"><select class="select" id="categorySelect" aria-label="Категорія">${catOptions(ui.category,true)}</select></div><div class="catalog">${arr.map(d=>`<article class="dish-card"><div class="dish-card-top">${renderDishIcon(d,'sm')}<div class="dish-card-meta"><div class="card-cat">${esc(d.category)} · ${esc(tasteSummary(d))}</div><div class="dish-type">${esc(d.type)}</div><h3>${esc(d.name)}</h3></div></div><p>${esc(d.description||'Опис не додано')}</p><div class="dish-card-foot"><span>${sm[d.id]?.games||0} двобоїв ${d.oldRating!==null&&d.oldRating!==undefined?` · Старий бал: ${esc(d.oldRating)}`:''}</span>${state.calibrations[d.id]?.mode==='auto'&&!state.calibrations[d.id].finished?`<button class="button tinted small" data-action="continueAuto" data-id="${esc(d.id)}">Продовжити калібрування</button>`:''}<button class="button secondary small" data-action="editDish" data-id="${esc(d.id)}">Змінити</button></div></article>`).join('')}</div>${!arr.length?'<div class="empty">Не знайдено жодної страви.</div>':''}`}
function historyView(){const items=state.history.filter(h=>ui.category==='all'||playedInCategory(h,ui.category)).slice().reverse();return `${pageHead('ПОВНИЙ ЖУРНАЛ','Історія двобоїв.','Кожен результат залишається записаним. При новому турнірі попередні матчі, бали та Elo не скидаються.',`<select class="select" id="categorySelect" aria-label="Категорія">${catOptions(ui.category,true)}</select>`)}<section class="panel"><div class="panel-head"><h2 class="panel-title">Усі голосування</h2><span class="pill-tag">${items.length}</span></div>${items.length?`<div class="history">${items.slice(0,200).map(h=>`<div class="history-line"><div class="history-dot">W</div><div class="history-main"><b>${esc(dish(h.winner)?.name||'Видалена страва')}</b> перемогла ${esc(dish(h.loser)?.name||'Видалена страва')}<div class="history-sub">${dateFmt(h.date)} · ${esc(h.category)} · ${esc({upper:'Верхня сітка',lower:'Нижня сітка',final:'Фінал',reset:'Повторний фінал',league:'Вільний двобій',calibration:'Калібрування Elo'}[h.lane]||'Матч')}</div>${h.lane==='calibration'?`<div class="history-sub">${h.auto?'Автокалібрування':'Калібрування'}: ${h.mutual===true?`Elo обох страв ±${Number(h.eloDelta||0).toFixed(1)}; вічні бали переможцю`:`історичний двобій — рейтинг змінено лише для «${esc(dish(h.target)?.name||'—')}»`}</div>`:''}</div><div class="history-xp">+${h.earned} балів</div></div>`).join('')}</div>${items.length>200?'<p class="section-note">Показано останні 200 голосувань. Усі результати доступні в JSON-резервній копії.</p>':''}`:'<div class="empty">Історія поки порожня. Проведіть свій перший двобій.</div>'}</section>`}
function settings(){const archived=state.dishes.filter(d=>d.archived);return `${pageHead('ДАНІ ТА МЕТОДОЛОГІЯ','Налаштування.','Тут можна створити резервну копію, перенести результати на інший пристрій та подивитися точні правила оцінювання.')} ${cloudPanel()}<div class="backup-grid"><article class="backup-block"><h3>Резервна копія</h3><p>Завантажте всі страви, історію результатів, турніри та чемпіонів одним JSON-файлом. Це також спосіб перенести дані на інший пристрій.</p><div class="controls"><button class="button primary" data-action="exportJson">Завантажити JSON</button><button class="button secondary" data-action="importJson">Імпортувати JSON</button></div></article><article class="backup-block"><h3>Експорт рейтингу</h3><p>Збережіть поточні результати у форматі CSV. Файл відкривається в Excel і містить рейтинг, бали, перемоги та кількість ігор.</p><div class="controls"><button class="button secondary" data-action="exportCsv">Експортувати CSV</button></div></article></div>${archived.length?`<section class="panel" style="margin-top:17px"><div class="panel-head"><h2 class="panel-title">Приховані страви (${archived.length})</h2></div><p class="small-text muted">Страви з історією двобоїв не стираються з розрахунків Elo: їх приховано з активних списків, щоб не втратити попередні результати. Можна створити нову страву з такою ж назвою: вона отримає новий Elo і власну історію. Старий запис можна відновити, тільки якщо активної страви з такою назвою в категорії немає.</p>${archived.map(d=>`<div class="leader-row"><div class="leader-data"><div class="leader-name">${esc(d.name)}</div><div class="leader-meta">${esc(d.category)}</div></div><button type="button" class="button secondary small" data-action="restoreDish" data-id="${esc(d.id)}">Відновити</button></div>`).join('')}</section>`:''}<section class="panel" style="margin-top:17px"><div class="panel-head"><h2 class="panel-title">Правила чесного рейтингу</h2></div><div class="bracket-grid"><div><div class="eyebrow">НЕЗНИКНЕННІ БАЛИ</div><div class="formula">Бали перемоги = округлити(10 + 8 × (1 − P))</div><p class="small-text muted">P — очікувана ймовірність перемоги відносно Elo суперника. Улюбленець отримує приблизно 11–14 балів, а несподівана перемога може дати до 18. За поразку накопичені бали не віднімаються.</p></div><div><div class="eyebrow">ELO ТА НАДІЙНІСТЬ</div><div class="formula">P = 1 / (1 + 10^((Elo₂ − Elo₁) / 400))<br>Новий Elo = Старий Elo + K × (Факт − P)</div><p class="small-text muted">На старті Elo = 1500, K = 32 (до 12 звичайних ігор), 24 (до 35), 16 (пізніше). Калібрувальні ігри не зменшують K для основної ліги. Нові калібрувальні двобої змінюють Elo ОБОХ страв із однаковим K: 32 у своїй категорії та 16 між категоріями. Старі калібрування лишаються за правилами на момент їх проведення. Для рейтингової таблиці використовується Elo − 65 / √(1 + звичайні ігри + 0,5 × калібрувальні ігри). Elo може як зростати, так і спадати, на відміну від вічних балів.</p></div></div><div class="notice" style="margin-top:15px"><b>Важливо:</b> турнір — це дві сітки з двома життями, а не точна класична фіксована сітка зі стандартним посівом на 8/16/32 учасників. Раунди формуються автоматично, а при непарній кількості учасників можливий пропуск раунду. У фіналі учасник верхньої сітки має право на одну поразку.</div></section><section class="panel" style="margin-top:17px"><div class="panel-head"><h2 class="panel-title">Одиночні категорії та калібрування</h2></div><p class="small-text muted">Кожна страва, навіть якщо вона єдина у всьому каталозі, має початковий Elo <b>1500</b> і 0 вічних балів. Для одиночної категорії (створеної раніше) можна вручну провести до <b>10</b> унікальних порівнянь зі стравами інших категорій, за бажанням серіями від 1 двобою. Elo обох страв змінюється з коефіцієнтом K = 16; переможець (хто б ним не був) отримує половину звичайних вічних балів (приблизно 5–9), переможений — 0 додаткових балів. У консервативному рейтингу міжкатегорійне калібрування рахується як половина звичайної гри, калібрування всередині категорії — як повна гра. Ці порівняння не беруть участі в турнірній сітці. Кожна нова страва автоматично переходить до калібрування з власною категорією; коли вона єдина, — з іншими категоріями. Кількість матчів — до 10, за послідовних результатів можливе раннє завершення. Якщо супротивників немає взагалі, Elo залишається 1500. Після додавання другої страви до категорії її можна оцінювати у звичайних двобоях.</p></section><section class="panel" style="margin-top:17px"><div class="panel-head"><h2 class="panel-title">Збереження та безпека</h2></div><p class="small-text muted">Дані зберігаються локально у вашому браузері за допомогою localStorage. Сторінка працює без сервера, і дані нікуди не надсилаються. Якщо очистити дані сайту, змінити браузер або відкрити файл за іншою адресою, результати можуть бути недоступні — робіть JSON-копії. На початку в застосунок завантажено 42 страви з FOOD.xlsx.</p><div style="margin-top:20px"><button class="button danger" data-action="resetAll">Видалити локальний прогрес та відновити 42 страви</button></div></section>`}
function renderModal(){if(!ui.modal)return '';const edit=ui.modal.type==='edit',d=edit?normalizeDish(dish(ui.modal.id)):null;const current=d||normalizeDish({name:'',description:'',category:ui.category==='all'?'Десерт':ui.category,taste:'',tasteTags:[],tasteCustom:'',type:'Універсальна страва'});const locked=edit&&(stats()[d.id]?.games>0||Object.values(state.tournaments).some(t=>!t.finished&&t.contestants.includes(d.id)));return `<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${edit?'Редагувати страву':'Нова страва'}</h2><button class="button ghost small" data-action="closeModal" aria-label="Закрити">✕</button></div><form id="dishForm"><div class="field"><label for="dishName">Назва *</label><input id="dishName" name="name" maxlength="130" required value="${esc(current.name)}" placeholder="Назва страви"></div><div class="field"><label for="dishCategory">Категорія *</label><select id="dishCategory" name="category" ${locked?'disabled':''}>${categoryList().map(c=>`<option value="${esc(c)}" ${current.category===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ Нова категорія...</option></select>${locked?'<div class="helper">Категорію не можна змінити, якщо страва вже має двобої або бере участь в активному турнірі.</div>':''}</div><div class="field" id="newCatField" style="display:none"><label for="newCat">Назва нової категорії</label><input id="newCat" name="newCategory" maxlength="45" placeholder="Наприклад, Сніданок"></div><div class="field two-col"><div><label for="dishType">Тип страви</label><select id="dishType" name="dishType">${typeOptions(current.type||inferDishType(current.name,current.description,current.category))}</select><div class="helper tags">Іконка малюється прямо кодом сайту — без окремих картинок. Для кожного типу використовується 2–3 майже однакові відтінки.</div></div><div><label>Попередній вигляд</label><div class="helper" style="text-align:center;padding:8px 0">${renderDishIcon(current,'modal-preview')}<div class="taste-preview">Мінімалістична SVG-іконка</div></div></div></div><div class="field"><label>Стандартні смакові мітки</label><input type="hidden" id="tasteTagsInput" name="tasteTags" value="${esc(selectedTasteHidden(current.tasteTags||[]))}">${renderTasteChips(current.tasteTags||[])}<div class="taste-preview" id="tastePreview">${esc((current.tasteTags||[]).join(', ')||'Оберіть одну або кілька готових міток')}</div></div><div class="field"><label for="dishTasteCustom">Кастомні смакові теги</label><input id="dishTasteCustom" name="tasteCustom" maxlength="120" value="${esc(current.tasteCustom||'')}" placeholder="Наприклад: лимонне, димне, святкове"><div class="helper tags">Можна ввести кілька тегів через кому.</div></div><div class="field"><label for="dishDescription">Опис</label><textarea id="dishDescription" name="description" maxlength="2000" placeholder="Інгредієнти, особливості, спогади...">${esc(current.description||'')}</textarea></div>${!edit?'<p class="notice small-text">Після збереження автоматично розпочнеться калібрування Elo: від 1 до 10 двобоїв (якщо є доступні суперники).</p>':''}<div class="modal-buttons">${edit?'<button type="button" class="button danger" data-action="removeDish" data-id="'+esc(d.id)+'">Видалити страву</button>':''}<button type="button" class="button secondary" data-action="closeModal">Скасувати</button><button class="button primary" type="submit">Зберегти страву</button></div></form></div></div>`}
function render(){if(!categoryList().includes(ui.category)&&ui.category!=='all')ui.category='Десерт';const pages={home,duel:duels,calibration,bracket:renderBracket,leaderboard,dishes:catalog,history:historyView,settings};$('#app').innerHTML=shell((pages[ui.page]||home)());if(ui.modal&&$('#dishCategory'))$('#dishCategory').dispatchEvent(new Event('change',{bubbles:false}));cloudRenderGoogle()}
function goPage(p){if(!PAGES[p])return;ui.page=p;ui.search='';if(ui.category==='all'&&['duel','bracket'].includes(p))ui.category='Десерт';render();window.scrollTo({top:0,behavior:'instant'})}
function newTournament(){const t=tournamentFor(ui.category);if(t&&!t.finished&&!confirm('Поточний турнір ще триває. Почати новий? Накопичені бали та попередні голосування збережуться, але поточна сітка зникне.'))return;initTournament(ui.category)}
function download(name,mime,content){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportJson(){download(`smakova-liga-backup-${new Date().toISOString().slice(0,10)}.json`,'application/json;charset=utf-8',JSON.stringify({...state,undo:null},null,2));toast('Резервну копію збережено.')}
function csvEscape(x){const s=String(x??'');return /[",\n\r;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){const sm=stats(),rows=[['Категорія','Страва','Смак','Elo','Консервативний рейтинг','Вічні бали','Перемоги','Поразки','Кількість двобоїв','Калібрувальні двобої','Частка перемог (%)','Оцінка з Excel'],...state.dishes.map(d=>{const s=sm[d.id];return [d.category,d.name,d.taste||'',Math.round(s.rating),Math.round(s.quality),s.xp,s.wins,s.losses,s.games,s.calibrationGames,Math.round(s.rate*100),d.oldRating??'']})];download(`smakova-liga-rating-${new Date().toISOString().slice(0,10)}.csv`,'text/csv;charset=utf-8','\uFEFF'+rows.map(r=>r.map(csvEscape).join(';')).join('\r\n'));toast('Рейтинг експортовано для Excel.')}
function handleAction(el){const action=el.dataset.action;switch(action){case'gotoDuel':goPage('duel');break;case'continueAuto':ui.calibrationTarget=el.dataset.id;goPage('calibration');break;case'categoryDuel':ui.category=el.dataset.category;if(inCat(ui.category).length===1){ui.calibrationTarget=inCat(ui.category)[0].id;goPage('calibration')}else goPage('duel');break;case'gotoCalibration':ui.calibrationTarget=inCat(ui.category)[0]?.id||null;goPage('calibration');break;case'startCalibration':startCalibration();break;case'voteCalibration':voteCalibration(el.dataset.id);break;case'skipCalibration':skipCalibration();break;case'mode':ui.mode=el.dataset.mode;render();break;case'newTournament':newTournament();break;case'vote':vote(el.dataset.id);break;case'undo':undoLast();break;case'skip':skipPair();break;case'addDish':ui.modal={type:'add'};render();break;case'editDish':ui.modal={type:'edit',id:el.dataset.id};render();break;case'closeModal':ui.modal=null;render();break;case'cloudRefresh':cloudRefresh();break;case'cloudLoad':cloudLoad();break;case'cloudUseLocal':cloudUseLocal();break;case'cloudSave':cloudSave();break;case'cloudSignOut':cloudSignOut();break;case'exportJson':exportJson();break;case'importJson':$('#importFile').click();break;case'exportCsv':exportCsv();break;case'removeDish':{
 const id=el.dataset.id,d=dish(id);if(!d||d.archived)break;
 const hasHistory=state.history.some(h=>h.winner===id||h.loser===id);
 const hasTourHistory=state.champions.some(x=>x.winner===id)||Object.values(state.tournaments).some(x=>x.finished&&x.contestants?.includes(id));
 const activeT=Object.values(state.tournaments).find(x=>!x.finished&&x.contestants?.includes(id));
 const keep=hasHistory||hasTourHistory||!!activeT;
 const prompt=keep?`Прибрати «${d.name}» з активного каталогу та рейтингу? Історія двобоїв, бали інших страв та Elo збережуться. ${activeT?'Поточний турнір категорії буде скасовано.':''} Страву можна буде відновити в Налаштуваннях.`:`Остаточно видалити «${d.name}»? Ця страва не має зіграних двобоїв.`;
 if(!confirm(prompt))break;
 if(keep){d.archived=true;d.archivedAt=new Date().toISOString();}else{state.dishes=state.dishes.filter(x=>x.id!==id);delete state.calibrations[id];}
 if(activeT)delete state.tournaments[activeT.category];
 for(const [category,tournament] of Object.entries(state.tournaments)){if(!tournament.finished&&tournament.contestants?.includes(id))delete state.tournaments[category];}
 // Existing calibration opponents may now be hidden; offer the next available one.
 for(const [target,plan] of Object.entries(state.calibrations)){
  if(plan.opponent!==id)continue;
  if(plan.mode==='auto'){
   plan.opponent=chooseAutoOpponent(target);
   if(!plan.opponent){plan.finished=true;plan.reason='exhausted';}
  }else{plan.opponent=chooseCalibrationOpponent(target);if(!plan.opponent)plan.target=calibrationHistory(target).length;}
 }
 state.freePairs={};state.undo=null;ui.modal=null;
 if(ui.calibrationTarget===id)ui.calibrationTarget=null;
 refreshDishLists({clearSearch:true});toast(keep?'Страву приховано з активного рейтингу. Історію збережено.':'Страву видалено.');break;
}case'restoreDish':{
 const d=dish(el.dataset.id);if(!d||!d.archived)break;
 if(dishNameTaken(d.name,d.category)){toast(`У категорії «${d.category}» вже є активна страва «${d.name}». Щоб відновити старий запис, спершу змініть назву або приберіть новий.`);break;}
 d.archived=false;delete d.archivedAt;state.freePairs={};state.undo=null;
 refreshDishLists({clearSearch:true});toast(`Страву «${d.name}» відновлено.`);break;
}case'resetAll':if(confirm('Дійсно видалити весь прогрес? Це незворотна дія. Раджу спершу експортувати JSON.'))if(confirm('Остаточне підтвердження: усі голосування та нові страви буде видалено.')){state=initial();state.dishes=(state.dishes||[]).map(d=>normalizeDish(d));ui.category='Десерт';ui.mode='tournament';ui.calibrationTarget=null;save();goPage('home');toast('Початкову таблицю відновлено.')}break}}
document.addEventListener('click',e=>{const chip=e.target.closest('[data-taste-chip]');if(chip){chip.classList.toggle('selected');const tags=[...document.querySelectorAll('[data-taste-chip].selected')].map(x=>x.dataset.tasteChip);if($('#tasteTagsInput'))$('#tasteTagsInput').value=tags.join('|');if($('#tastePreview'))$('#tastePreview').textContent=tags.length?tags.join(', '):'Оберіть одну або кілька готових міток';return}const page=e.target.closest('[data-page]');if(page){goPage(page.dataset.page);return}const action=e.target.closest('[data-action]');if(action){handleAction(action);return}if(e.target.id==='modalBackdrop'){ui.modal=null;render()}});
document.addEventListener('change',e=>{if(e.target.id==='categorySelect'){if(ui.page==='leaderboard')ui.rankCategory=e.target.value;else ui.category=e.target.value;ui.search='';if(['duel','bracket'].includes(ui.page)&&ui.category==='all')ui.category='Десерт';render()}if(e.target.id==='rankSort'){ui.rankSort=e.target.value;render()}if(e.target.id==='calibrationSelect'){ui.calibrationTarget=e.target.value;ui.calibrationCount=5;render()}if(e.target.id==='calibrationCount'){ui.calibrationCount=Number(e.target.value);render()}if(e.target.id==='dishCategory'){$('#newCatField').style.display=e.target.value==='__new'?'block':'none'}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const caret=e.target.selectionStart;ui.search=e.target.value;render();const inp=$('#searchInput');if(inp){inp.focus();try{inp.setSelectionRange(caret,caret)}catch{}}}});
document.addEventListener('submit',e=>{if(e.target.id!=='dishForm')return;e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim(),description=String(f.get('description')||'').trim(),tasteTags=splitTags(String(f.get('tasteTags')||'').replace(/\|/g,',')),tasteCustom=String(f.get('tasteCustom')||'').trim();let category=String(f.get('category')||''),id=ui.modal?.id,type=String(f.get('dishType')||'').trim();if(category==='__new')category=String(f.get('newCategory')||'').trim();if(ui.modal?.type==='edit'&&!category)category=dish(id)?.category||'';if(!name||!category){toast('Заповніть назву страви та категорію.');return}if(dishNameTaken(name,category,id)){toast('Активна страва з такою назвою вже є в цій категорії. Приховані страви не блокують повторне додавання.');return}type=type||inferDishType(name,description,category);const taste=mergeTaste(tasteTags,tasteCustom).join(', ');if(ui.modal?.type==='edit'){const target=dish(id);if(!target)return;if(target.category!==category&&(stats()[id].games>0||Object.values(state.tournaments).some(t=>!t.finished&&t.contestants.includes(id)))){toast('Не можна змінити категорію страви з історією або активним турніром.');return}const oldCategory=target.category;Object.assign(target,normalizeDish({...(target||{}),name,description,taste,category,type,tasteTags,tasteCustom}));if(category!==oldCategory){state.freePairs={};if(ui.category!=='all')ui.category=category;}toast('Зміни збережено.')}else{const newId=uid();state.dishes.push(normalizeDish({id:newId,name,description,taste,category,type,tasteTags,tasteCustom,oldRating:null,oldAux:null}));state.freePairs={};beginAutoCalibration(newId);ui.calibrationTarget=newId;ui.category=category;ui.page='calibration';ui.search='';toast(autoCandidates(newId).length||calibrationPlan(newId).opponent?'Страву додано. Розпочато калібрування.':'Страву додано з початковим Elo 1500. Немає суперників.')}state.undo=null;ui.modal=null;refreshDishLists({clearSearch:true})});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!validState(parsed)){toast('Файл не містить коректної резервної копії Смакової ліги.');return}if(!confirm('Імпорт замінить усі локальні страви, двобої та турніри даними з файлу. Продовжити?'))return;state=parsed;state.undo=null;state.freePairs=state.freePairs||{};state.calibrations=state.calibrations||{};state.dishes=(state.dishes||[]).map(d=>normalizeDish(d));ui.calibrationTarget=null;ui.category='Десерт';ui.rankCategory='all';ui.modal=null;refreshDishLists({clearSearch:true});goPage('home');toast('Резервну копію відновлено.')}catch(err){toast('Не вдалося прочитати JSON-файл.')}finally{e.target.value=''}});
// Sync lists when another tab of the same site changes its local data.
window.addEventListener('storage',e=>{
 if(e.key!==STORAGE_KEY)return;
 try{
  const incoming=e.newValue?JSON.parse(e.newValue):initial();
  if(!validState(incoming))return;
  state=incoming;state.calibrations=state.calibrations||{};state.freePairs=state.freePairs||{};
  state.dishes=state.dishes.map(d=>normalizeDish(d));
  if(ui.calibrationTarget&&(!dish(ui.calibrationTarget)||dish(ui.calibrationTarget).archived))ui.calibrationTarget=null;
  ui.modal=null;ui.search='';
  if(ui.rankCategory!=='all'&&!categoryList().includes(ui.rankCategory))ui.rankCategory='all';
  if(ui.category!=='all'&&!categoryList().includes(ui.category))ui.category='all';
  render();toast('Списки оновлено відповідно до змін в іншій вкладці.');
 }catch(err){/* A corrupted or unrelated storage value must not damage the visible state. */}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();return}const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||ui.modal||!['duel','calibration'].includes(ui.page))return;const c=calibrationPlan(ui.calibrationTarget),pair=ui.page==='calibration'&&c?.opponent?{a:ui.calibrationTarget,b:c.opponent}:ui.page==='duel'?currentPair():null;if(!pair)return;const castVote=ui.page==='calibration'?voteCalibration:vote;if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();castVote(pair.a)}else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();castVote(pair.b)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoLast()}});
render();
// Do not block offline mode while checking GitHub in the background.
if(location.protocol==='https:'||location.protocol==='http:')cloudRefresh({automatic:true});
