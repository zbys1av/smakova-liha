<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Смакова ліга — кухар</title>
<desc id="desc">Помаранчевий силует обличчя без рис, білий кухарський ковпак на темно-зеленому тлі.</desc>
<!-- Rounded icon field -->
<rect x="4" y="4" width="248" height="248" rx="52" fill="#17291f"/>
<!-- Head, deliberately no eyes, nose, mouth, or ears -->
<path d="M80 141h96v49c0 30-21 48-48 48s-48-18-48-48v-49Z" fill="#f28b4b"/>
<!-- Cloud-like three-lobed chef hat, proportioned to the reference sketch -->
<path d="M70 144 C42 143 24 123 24 100 C24 76 44 58 66 58 C78 58 89 62 101 73 C107 45 126 27 150 28 C176 29 194 47 199 69 C210 62 221 62 231 66 C247 73 248 92 245 106 C241 128 225 141 199 143 Z" fill="#fff8ec"/>
<!-- Cap band; wide enough to be legible at favicon sizes -->
<path d="M76 128c27 2 77 2 104 0l2 42c-30 5-77 5-108 0l2-42Z" fill="#fffdf5"/>
<!-- Broad, restrained warm edge separating hat from head -->
<path d="M79 168c28 4 71 4 99 0" fill="none" stroke="#e5d1af" stroke-width="4" stroke-linecap="round"/>
</svg>
